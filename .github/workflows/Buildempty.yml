name: Build Android APK v4.0 (Fictional Settings)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cap6-agp821-v4-fictional-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: |
            gradle-cap6-agp821-v4-fictional-

      - name: Configure Maven Central mirror to avoid HTTP 429
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { artifactRepository ->
                          if (artifactRepository instanceof MavenArtifactRepository) {
                              def urlStr = artifactRepository.url.toString()
                              if (urlStr.startsWith("https://repo.maven.apache.org/maven2") || urlStr.startsWith("https://repo1.maven.org/maven2")) {
                                  artifactRepository.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { artifactRepository ->
                      if (artifactRepository instanceof MavenArtifactRepository) {
                          def urlStr = artifactRepository.url.toString()
                          if (urlStr.startsWith("https://repo.maven.apache.org/maven2") || urlStr.startsWith("https://repo1.maven.org/maven2")) {
                              artifactRepository.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Prepare Android SDK licenses
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare web assets (www), generate fictional settings.json and sanitize build copy
        run: |
          rm -rf www android node_modules package.json package-lock.json capacitor.config.* /tmp/e_ukraine_fonts
          mkdir -p www /tmp/e_ukraine_fonts

          # Копіюємо файли у тимчасову папку збірки www/ (оригінал у репозиторії не змінюється)
          find . -maxdepth 1 -type f ! -name "*.yml" ! -name "*.md" ! -name ".*" ! -name "settings.json" ! -name "image.jpg" ! -name "qr.jpg" -exec cp {} www/ \;

          if [ -f "www/e-Ukraine.zip" ]; then
            unzip -o "www/e-Ukraine.zip" -d /tmp/e_ukraine_fonts > /dev/null 2>&1 || true
            rm -rf /tmp/e_ukraine_fonts/__MACOSX
            find /tmp/e_ukraine_fonts -type f \( -iname "*.otf" -o -iname "*.ttf" \) | while read -r font_file; do
              base_name=$(basename "$font_file")
              clean_name=$(echo "$base_name" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
              cp "$font_file" "www/$base_name"
              cp "$font_file" "www/$clean_name"
            done
            rm -f "www/e-Ukraine.zip"
          fi

          python3 - << 'PYEOF'
          import json, os, re, struct, zlib

          fictional_values = {
              "fullName": "Коваленко\nТарас\nОлегович",
              "name": "Коваленко Тарас Олегович",
              "pib": "Коваленко Тарас Олегович",
              "surname": "Коваленко",
              "firstName": "Тарас",
              "middleName": "Олегович",
              "birthDate": "14.07.1995",
              "dob": "14.07.1995",
              "rnokpp": "0000000000",
              "taxId": "0000000000",
              "ipn": "0000000000",
              "tck": "Вигаданий ТЦК №000 (Тестовий район)",
              "rtc": "Вигаданий ТЦК №000 (Тестовий район)",
              "rank": "Солдат",
              "vos": "000000",
              "vosDesc": "Тестовий опис ВОС для перевірки інтерфейсу",
              "category": "Військовозобов’язаний",
              "role": "Військовозобов’язаний",
              "oberig": "000000000000000000000",
              "registryNumber": "000000000000000000000",
              "phone": "+380 00 000 0000",
              "address": "Тестова вул., буд. 1, кв. 1",
              "deferral": "01.01.2028",
              "updatedAt": "12:00 | 01.01.2026",
              "ticker": "Документ оновлено о 12:00 | 01.01.2026",
              "qrTitle": "Тестовий QR-код дійсний до 01 січня 2028",
              "qrNote": "Тестове повідомлення. Вигадані дані для перевірки."
          }

          def fill_fictional(obj, key_hint=""):
              if isinstance(obj, dict):
                  return {k: fill_fictional(v, k) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [fill_fictional(item, key_hint) for item in obj]
              elif isinstance(obj, bool):
                  return False
              elif isinstance(obj, (int, float)):
                  return 0
              elif isinstance(obj, str):
                  kl = key_hint.lower()
                  for k, val in fictional_values.items():
                      if k.lower() == kl:
                          return val
                  if "birth" in kl or "dob" in kl or "date" in kl:
                      return "14.07.1995"
                  if "name" in kl or "pib" in kl or "fio" in kl:
                      return "Коваленко Тарас Олегович"
                  if "phone" in kl or "tel" in kl:
                      return "+380 00 000 0000"
                  if "addr" in kl:
                      return "Тестова вул., буд. 1, кв. 1"
                  if "tck" in kl or "unit" in kl or "office" in kl:
                      return "Вигаданий ТЦК №000 (Тестовий район)"
                  return ""
              return obj

          settings_data = {}
          if os.path.exists("settings.json"):
              try:
                  with open("settings.json", "r", encoding="utf-8") as f:
                      raw_settings = json.load(f)
                  settings_data = fill_fictional(raw_settings)
              except Exception:
                  settings_data = {}

          for k, v in fictional_values.items():
              if k not in settings_data:
                  settings_data[k] = v

          with open("www/settings.json", "w", encoding="utf-8") as f:
              json.dump(settings_data, f, ensure_ascii=False, indent=2)

          # Замінюємо виявлені значення в копії файлів збірки www/ (оригінал у репозиторії не змінюється)
          replace_pairs = {
              "Філоненко": "Коваленко",
              "Ігор": "Тарас",
              "Миколайович": "Олегович",
              "22.03.1999": "14.07.1995",
              "1999": "1995",
              "3624010596": "0000000000",
              "180220235594604900049": "000000000000000000000",
              "Харківського РТЦК та СП (Дергачі)": "Вигаданий ТЦК №000 (Тестовий район)",
              "1 відділ Харківського РТЦК та СП": "Вигаданий ТЦК №000",
              "Мала Данилівка, Академічна, б. 4, кв. 183": "Тестова вул., буд. 1, кв. 1",
              "+380 98 780 9397": "+380 00 000 0000",
              "13:58 | 28.08.2026": "12:00 | 01.01.2026",
              "16:35 | 26.11.2026": "12:00 | 01.01.2026",
              "26.11.2026": "01.01.2026",
              "28.08.2026": "01.01.2026",
              "20.05.2024": "01.01.2025",
              "26 листопада 2027": "01 січня 2028",
              "Ihor Filonenko": "Taras Kovalenko",
              "FLVMEFRKR": "TEST_ALIAS"
          }

          text_exts = {".html", ".htm", ".js", ".mjs", ".css", ".json", ".txt", ".svg"}
          for root, _, files in os.walk("www"):
              for fname in files:
                  if fname == "settings.json":
                      continue
                  if os.path.splitext(fname)[1].lower() not in text_exts:
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          src = f.read()
                      out = src
                      for old_s, new_s in replace_pairs.items():
                          out = out.replace(old_s, new_s)
                      out = re.sub(r"\b\d{21}\b", "000000000000000000000", out)
                      out = re.sub(r"\b\d{10}\b", "0000000000", out)
                      if out != src:
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.write(out)
                  except Exception:
                      pass

          def write_png(path, width, height, rgba):
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              r, g, b, a = rgba
              row = bytes([r, g, b, a]) * width
              for _ in range(height):
                  raw.append(0)
                  raw.extend(row)
              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=6)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          write_png("www/image.jpg", 16, 16, (213, 208, 188, 255))
          write_png("www/qr.jpg", 16, 16, (255, 255, 255, 255))
          PYEOF

          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              echo "<html><body></body></html>" > www/index.html
            fi
          fi

          cat www/settings.json
          ls -la www

      - name: Initialize Capacitor 6 and Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Резерв+" "ua.gov.rezervplus.app" --web-dir=www
          npx cap add android

      - name: Configure app icon, system bars and clean WebView MainActivity v4.0
        run: |
          mkdir -p android/app/src/main/res/font

          for f in www/*.otf www/*.ttf; do
            [ -f "$f" ] || continue
            bn=$(basename "$f" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
            cp "$f" "android/app/src/main/res/font/$bn"
          done

          ICON_SRC=""
          if [ -f www/app.ico ]; then
            ICON_SRC="www/app.ico"
          elif [ -f www/app.png ]; then
            ICON_SRC="www/app.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            for dir in android/app/src/main/res/mipmap-*dpi; do
              [ -d "$dir" ] || continue
              rm -f "$dir"/*.png "$dir"/*.webp
              cp "$ICON_SRC" "$dir/ic_launcher.png"
              cp "$ICON_SRC" "$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
            done
          fi

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#DDD8C4</item>
                  <item name="colorPrimaryDark">#DDD8C4</item>
                  <item name="colorAccent">#F38A00</item>
                  <item name="android:windowBackground">#DDD8C4</item>
                  <item name="android:statusBarColor">#DDD8C4</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowBackground">#DDD8C4</item>
                  <item name="android:statusBarColor">#DDD8C4</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/java/ua/gov/rezervplus/app/MainActivity.java
          package ua.gov.rezervplus.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int COL_KHAKI = Color.parseColor("#DDD8C4");
              private static final int COL_WHITE = Color.parseColor("#FFFFFF");

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window w = getWindow();
                  w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      w.setStatusBarColor(COL_KHAKI);
                      w.setNavigationBarColor(COL_WHITE);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      View decor = w.getDecorView();
                      int vis = decor.getSystemUiVisibility() | View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vis |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }
                      decor.setSystemUiVisibility(vis);
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      webView.setBackgroundColor(COL_KHAKI);
                      WebSettings settings = webView.getSettings();
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setDomStorageEnabled(true);
                  }
              }
          }
          EOF

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew

          attempt=1
          max_attempts=5
          until ./gradlew assembleDebug --no-daemon; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Gradle build failed after $max_attempts attempts"
              exit 1
            fi
            sleep_sec=$((attempt * 15))
            echo "Maven/Gradle transient error (429/network). Retry $((attempt + 1))/$max_attempts in ${sleep_sec}s..."
            sleep "$sleep_sec"
            rm -rf ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/wrapper/dists/*/*.lck || true
            attempt=$((attempt + 1))
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RezervPlus-APK-v4.0-fictional
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
