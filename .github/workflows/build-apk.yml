              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  fontUltraLight = loadFontByName("e_ukraine_ultralight", Typeface.NORMAL);
                  fontThin = loadFontByName("e_ukraine_thin", Typeface.NORMAL);
                  fontLight = loadFontByName("e_ukraine_light", Typeface.NORMAL);
                  fontRegular = loadFontByName("e_ukraine_regular", Typeface.NORMAL);
                  fontMedium = loadFontByName("e_ukraine_medium", Typeface.NORMAL);
                  fontBold = loadFontByName("e_ukraine_bold", Typeface.BOLD);

                  prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  loadSavedState();

                  rootContainer = new FrameLayout(this);
                  rootContainer.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout verticalStack = new LinearLayout(this);
                  verticalStack.setOrientation(LinearLayout.VERTICAL);
                  verticalStack.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  contentHost = new FrameLayout(this);
                  contentHost.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                  ));

                  bottomNavBar = buildBottomNavBar();

                  verticalStack.addView(contentHost);
                  verticalStack.addView(bottomNavBar);
                  rootContainer.addView(verticalStack);

                  setContentView(rootContainer);
                  showScreen("splash");
              }

              private Typeface loadFontByName(String fontName, int fallbackStyle) {
                  try {
                      int resId = getResources().getIdentifier(fontName, "font", getPackageName());
                      if (resId != 0) {
                          Typeface tf = ResourcesCompat.getFont(this, resId);
                          if (tf != null) return tf;
                      }
                  } catch (Exception ignored) {
                  }
                  return Typeface.create(Typeface.SANS_SERIF, fallbackStyle);
              }

              private void loadSavedState() {
