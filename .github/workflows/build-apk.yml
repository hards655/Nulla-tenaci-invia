name: Build Android APK from HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null || true

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          # Копіюємо всі файли проєкту (html, jpg, png, otf, json) у папку www
          find . -maxdepth 1 -type f ! -name "*.yml" ! -name "*.md" -exec cp {} www/ \;

          # Перейменовуємо головний HTML у index.html, якщо він називається інакше
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            fi
          fi

      - name: Initialize Capacitor and Android platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Резерв+" "ua.gov.rezervplus.app" --web-dir=www
          npx cap add android

      - name: Configure Android icon and Fullscreen/Edge-to-Edge theme
        run: |
          # Встановлюємо app.png як іконку додатку, якщо файл існує
          if [ -f www/app.png ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              rm -f "$dir"/*.webp "$dir"/*.png
              cp www/app.png "$dir/ic_launcher.png"
              cp www/app.png "$dir/ic_launcher_round.png"
              cp www/app.png "$dir/ic_launcher_foreground.png"
            done
          fi

          # Налаштовуємо тему додатку та колір нижньої панелі
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#1E1E1A</item>
                  <item name="colorAccent">#F38A00</item>
                  <item name="android:windowBackground">#1E1E1A</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowBackground">#1E1E1A</item>
              </style>
          </resources>
          EOF

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RezervPlus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
