name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK licenses
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare web assets (www)
        run: |
          rm -rf www android node_modules package.json package-lock.json capacitor.config.*
          mkdir -p www

          # Копируем все файлы репозитория (html, jpg, png, otf, json, ico) в www
          find . -maxdepth 1 -type f ! -name "*.yml" ! -name "*.md" ! -name ".*" -exec cp {} www/ \;

          # Гарантируем наличие index.html
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -z "$FIRST_HTML" ]; then
              echo "Error: HTML file not found in repository root!"
              exit 1
            fi
            cp "$FIRST_HTML" www/index.html
          fi

          # Автоматически чиним опечатку "- {" на "* {" в CSS
          sed -i 's/^- {/\* {/' www/index.html

      - name: Initialize Capacitor 6 and Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Резерв+" "ua.gov.rezervplus.app" --web-dir=www
          npx cap add android

      - name: Configure icons and Android theme
        run: |
          # Генерируем валидные PNG-иконки из app.png через встроенный ImageMagick (convert)
          if [ -f www/app.png ]; then
            declare -A SIZES=(
              ["mipmap-mdpi"]=48
              ["mipmap-hdpi"]=72
              ["mipmap-xhdpi"]=96
              ["mipmap-xxhdpi"]=144
              ["mipmap-xxxhdpi"]=192
            )
            for folder in "${!SIZES[@]}"; do
              target_dir="android/app/src/main/res/$folder"
              size="${SIZES[$folder]}"
              if [ -d "$target_dir" ]; then
                rm -f "$target_dir"/*.png "$target_dir"/*.webp
                convert www/app.png -resize "${size}x${size}!" PNG32:"$target_dir/ic_launcher.png"
                cp "$target_dir/ic_launcher.png" "$target_dir/ic_launcher_round.png"
                cp "$target_dir/ic_launcher.png" "$target_dir/ic_launcher_foreground.png"
              fi
            done
          fi

          # Настраиваем цвета статус-бара и нижней панели навигации
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#DDD8C4</item>
                  <item name="colorPrimaryDark">#1E1E1A</item>
                  <item name="colorAccent">#F38A00</item>
                  <item name="android:windowBackground">#1E1E1A</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowBackground">#1E1E1A</item>
              </style>
          </resources>
          EOF

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RezervPlus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
