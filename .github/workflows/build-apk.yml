              private void saveState() {
                  prefs.edit()
                          .putString("fullName", fullName)
                          .putString("roleText", roleText)
                          .putString("dobText", dobText)
                          .putString("deferralText", deferralText)
                          .putString("tickerText", tickerText)
                          .putString("rnokppText", rnokppText)
                          .putString("tckText", tckText)
                          .putString("rankText", rankText)
                          .putString("vosText", vosText)
                          .putString("vosDescText", vosDescText)
                          .putString("categoryText", categoryText)
                          .putString("oberigText", oberigText)
                          .putString("phoneText", phoneText)
                          .putString("addressText", addressText)
                          .putString("verifiedStatusText", verifiedStatusText)
                          .putString("verifiedDateText", verifiedDateText)
                          .putString("qrTitleText", qrTitleText)
                          .putString("qrNoteText", qrNoteText)
