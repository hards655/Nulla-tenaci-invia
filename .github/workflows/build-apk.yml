              private void openDocumentActionsDialog() {
                  String[] items = {
                          "Переглянути документ",
                          "Завантажити PDF",
                          "Оновити документ"
                  };
                  new AlertDialog.Builder(this)
                          .setTitle("Дії з документом")
                          .setItems(items, (dialog, which) -> {
                              if (which == 0) {
                                  showScreen("full_info");
                              } else if (which == 1) {
                                  Toast.makeText(this, "PDF файл сформовано", Toast.LENGTH_SHORT).show();
                              } else if (which == 2) {
                                  triggerDocumentUpdate();
                              }
                          })
                          .show();
              }

              private void triggerDocumentUpdate() {
                  if (docUpdateRunnable != null) handler.removeCallbacks(docUpdateRunnable);
                  isUpdatingDoc = true;
                  if (activeTickerStrip != null && activeTickerView != null) {
                      activeTickerStrip.setBackgroundColor(COL_TICKER_YELLOW);
                      activeTickerView.setTextColor(COL_TEXT);
                      String msg = "Оновлюємо документ • Потрібно почекати";
                      activeTickerView.setText(msg + " • " + msg);
                  }
                  docUpdateRunnable = () -> {
                      isUpdatingDoc = false;
                      String nowStr = new SimpleDateFormat("HH:mm | dd.MM.yyyy", Locale.getDefault()).format(new Date());
                      tickerText = "Документ оновлено о " + nowStr;
                      saveState();
                      if ("id".equals(currentScreen)) {
                          showScreen("id");
                      }
                      Toast.makeText(this, "Документ оновлено", Toast.LENGTH_SHORT).show();
                  };
                  handler.postDelayed(docUpdateRunnable, 10000);
              }

