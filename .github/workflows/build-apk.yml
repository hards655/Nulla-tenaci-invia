name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK licenses
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare web assets (www)
        run: |
          rm -rf www android node_modules package.json package-lock.json capacitor.config.*
          mkdir -p www
          find . -maxdepth 1 -type f ! -name "*.yml" ! -name "*.md" ! -name ".*" -exec cp {} www/ \;
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              echo "<html><body>Резерв+</body></html>" > www/index.html
            fi
          fi

      - name: Initialize Capacitor 6 and Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Резерв+" "ua.gov.rezervplus.app" --web-dir=www
          npx cap add android

      - name: Unpack e-Ukraine fonts, configure icon, theme and native MainActivity
        run: |
          mkdir -p android/app/src/main/res/font android/app/src/main/assets /tmp/e_ukraine_fonts

          ZIP_SRC=""
          if [ -f "e-Ukraine.zip" ]; then
            ZIP_SRC="e-Ukraine.zip"
          elif [ -f "www/e-Ukraine.zip" ]; then
            ZIP_SRC="www/e-Ukraine.zip"
          fi

          if [ -n "$ZIP_SRC" ]; then
            unzip -o "$ZIP_SRC" -d /tmp/e_ukraine_fonts > /dev/null 2>&1 || true
            rm -rf /tmp/e_ukraine_fonts/__MACOSX
            find /tmp/e_ukraine_fonts -type f \( -iname "*.otf" -o -iname "*.ttf" \) | while read -r font_file; do
              base_name=$(basename "$font_file")
              clean_name=$(echo "$base_name" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
              cp "$font_file" "android/app/src/main/res/font/$clean_name"
              cp "$font_file" "www/$clean_name"
              cp "$font_file" "android/app/src/main/assets/$clean_name"
            done
          fi

          for f in e_ukraine_light.otf e_ukraine_regular.otf e_ukraine_medium.otf e_ukraine_bold.otf e_ukraine_thin.otf e_ukraine_ultralight.otf; do
            if [ -f "www/$f" ]; then
              cp "www/$f" "android/app/src/main/res/font/$f"
            fi
          done

          ls -la android/app/src/main/res/font || true

          ICON_SRC=""
          if [ -f www/app.ico ]; then
            ICON_SRC="www/app.ico"
          elif [ -f www/app.png ]; then
            ICON_SRC="www/app.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            for dir in android/app/src/main/res/mipmap-*dpi; do
              [ -d "$dir" ] || continue
              rm -f "$dir"/*.png "$dir"/*.webp
              cp "$ICON_SRC" "$dir/ic_launcher.png"
              cp "$ICON_SRC" "$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
            done
          fi

          for asset in load.jpg image.jpg qr.jpg app.ico app.png settings.json; do
            if [ -f "www/$asset" ]; then
              cp "www/$asset" "android/app/src/main/assets/$asset"
            fi
          done

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#DDD8C4</item>
                  <item name="colorPrimaryDark">#DDD8C4</item>
                  <item name="colorAccent">#F38A00</item>
                  <item name="android:windowBackground">#DDD8C4</item>
                  <item name="android:statusBarColor">#DDD8C4</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowBackground">#1E1E1A</item>
                  <item name="android:statusBarColor">#1E1E1A</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/java/ua/gov/rezervplus/app/MainActivity.java
