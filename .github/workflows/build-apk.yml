              private void applySystemBarColors(String screen) {
                  Window w = getWindow();
                  w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                  int topColor = "splash".equals(screen) ? COL_DARK_SPLASH : COL_KHAKI;
                  int navColor = COL_WHITE;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      w.setStatusBarColor(topColor);
                      w.setNavigationBarColor(navColor);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      View decor = w.getDecorView();
                      int vis = decor.getSystemUiVisibility();
                      if ("splash".equals(screen)) {
                          vis &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      } else {
                          vis |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vis |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }
                      decor.setSystemUiVisibility(vis);
                  }
              }

              private int dp(float val) {
                  return Math.round(TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP, val, getResources().getDisplayMetrics()
                  ));
              }

              private GradientDrawable makeRoundBg(int fillColor, float radiusDp, int strokeColor, int strokeDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(fillColor);
                  gd.setCornerRadius(dp(radiusDp));
                  if (strokeDp > 0) {
                      gd.setStroke(dp(strokeDp), strokeColor);
                  }
                  return gd;
              }

              private Bitmap loadBitmapAssetOrUri(String uriStr, String fallbackAsset) {
                  try {
                      if (!TextUtils.isEmpty(uriStr)) {
                          InputStream is = getContentResolver().openInputStream(Uri.parse(uriStr));
                          if (is != null) {
                              Bitmap bmp = BitmapFactory.decodeStream(is);
                              is.close();
                              if (bmp != null) return bmp;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      if (!TextUtils.isEmpty(fallbackAsset)) {
                          InputStream is = getAssets().open(fallbackAsset);
                          Bitmap bmp = BitmapFactory.decodeStream(is);
                          is.close();
                          if (bmp != null) return bmp;
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }

              private Bitmap makeEmblemBitmap(int sizeDp, int tintColor) {
                  int px = Math.max(24, dp(sizeDp));
                  Bitmap bmp = Bitmap.createBitmap(px, px, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bmp);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(tintColor);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(px * 0.08f);
                  RectF shield = new RectF(px * 0.16f, px * 0.10f, px * 0.84f, px * 0.88f);
                  c.drawRoundRect(shield, px * 0.12f, px * 0.12f, p);
                  p.setStyle(Paint.Style.FILL);
                  c.drawRect(px * 0.44f, px * 0.24f, px * 0.56f, px * 0.72f, p);
                  c.drawRect(px * 0.28f, px * 0.28f, px * 0.72f, px * 0.38f, p);
                  return bmp;
              }

              private void showScreen(String name) {
                  currentScreen = name;
                  if (autoNavRunnable != null) {
                      handler.removeCallbacks(autoNavRunnable);
                      autoNavRunnable = null;
                  }

                  applySystemBarColors(name);
                  rootContainer.setBackgroundColor("splash".equals(name) ? COL_DARK_SPLASH : COL_KHAKI);
                  contentHost.removeAllViews();

                  boolean showNav = !"splash".equals(name) && !"pin".equals(name) && !"full_info".equals(name);
                  bottomNavBar.setVisibility(showNav ? View.VISIBLE : View.GONE);

                  if ("splash".equals(name)) {
                      contentHost.addView(buildSplashView());
                      autoNavRunnable = () -> showScreen("pin");
                      handler.postDelayed(autoNavRunnable, 1800);
                  } else if ("pin".equals(name)) {
                      pinCode = "";
                      contentHost.addView(buildPinView());
                  } else if ("loading".equals(name)) {
                      updateNavSelection("id");
                      contentHost.addView(buildLoadingView());
                      autoNavRunnable = () -> showScreen("id");
                      handler.postDelayed(autoNavRunnable, 1800);
                  } else if ("id".equals(name)) {
                      updateNavSelection("id");
                      contentHost.addView(buildIdCardScreen());
                  } else if ("services".equals(name)) {
                      updateNavSelection("services");
                      contentHost.addView(buildServicesScreen());
                  } else if ("vacancies".equals(name)) {
                      updateNavSelection("vacancies");
                      contentHost.addView(buildVacanciesScreen());
                  } else if ("menu".equals(name)) {
                      updateNavSelection("menu");
                      contentHost.addView(buildMenuScreen());
                  } else if ("full_info".equals(name)) {
                      contentHost.addView(buildFullInfoScreen());
                  }
              }

              private View buildSplashView() {
                  FrameLayout fl = new FrameLayout(this);
                  fl.setBackgroundColor(COL_DARK_SPLASH);
                  ImageView iv = new ImageView(this);
                  iv.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Bitmap bmp = loadBitmapAssetOrUri("", "load.jpg");
                  if (bmp != null) {
                      iv.setImageBitmap(bmp);
                  }
                  fl.addView(iv);
                  fl.setOnClickListener(v -> showScreen("pin"));
                  return fl;
              }

              private View buildPinView() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(COL_KHAKI);
                  root.setPadding(dp(24), dp(20), dp(24), dp(20));

                  TextView title = new TextView(this);
                  title.setText("Код для входу");
                  title.setTypeface(fontRegular);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 28);
                  title.setTextColor(COL_TEXT);
                  root.addView(title);

                  LinearLayout dotsRow = new LinearLayout(this);
                  dotsRow.setOrientation(LinearLayout.HORIZONTAL);
                  dotsRow.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams dotsLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  dotsLp.topMargin = dp(24);
                  dotsLp.bottomMargin = dp(24);
                  dotsRow.setLayoutParams(dotsLp);

                  View[] dots = new View[4];
                  for (int i = 0; i < 4; i++) {
                      View dot = new View(this);
                      LinearLayout.LayoutParams dLp = new LinearLayout.LayoutParams(dp(12), dp(12));
                      if (i > 0) dLp.leftMargin = dp(24);
                      dot.setLayoutParams(dLp);
                      dot.setBackground(makeRoundBg(COL_WHITE, 6, 0, 0));
                      dots[i] = dot;
                      dotsRow.addView(dot);
                  }
                  root.addView(dotsRow);

                  LinearLayout pad = new LinearLayout(this);
                  pad.setOrientation(LinearLayout.VERTICAL);
                  pad.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams padLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  );
                  pad.setLayoutParams(padLp);

                  String[][] rows = {
                          {"1", "2", "3"},
                          {"4", "5", "6"},
                          {"7", "8", "9"},
                          {"BIO", "0", "DEL"}
                  };

                  for (String[] r : rows) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams rLp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                      rLp.topMargin = dp(8);
                      rLp.bottomMargin = dp(8);
                      row.setLayoutParams(rLp);

                      for (int c = 0; c < 3; c++) {
                          String key = r[c];
                          FrameLayout cell = new FrameLayout(this);
                          LinearLayout.LayoutParams cLp = new LinearLayout.LayoutParams(0, dp(76), 1f);
                          cell.setLayoutParams(cLp);

                          TextView btn = new TextView(this);
                          FrameLayout.LayoutParams bLp = new FrameLayout.LayoutParams(dp(72), dp(72), Gravity.CENTER);
                          btn.setLayoutParams(bLp);
                          btn.setGravity(Gravity.CENTER);
                          btn.setTypeface(fontRegular);

                          if ("BIO".equals(key)) {
                              btn.setText("❖");
                              btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                              btn.setTextColor(COL_WHITE);
                              btn.setOnClickListener(v -> showScreen("loading"));
                          } else if ("DEL".equals(key)) {
                              btn.setText("⌫");
                              btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 24);
                              btn.setTextColor(COL_TEXT);
                              btn.setBackground(makeRoundBg(COL_WHITE, 36, 0, 0));
                              btn.setOnClickListener(v -> {
                                  if (pinCode.length() > 0) {
                                      pinCode = pinCode.substring(0, pinCode.length() - 1);
                                      refreshDots(dots);
                                  }
                              });
                          } else {
                              btn.setText(key);
                              btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 32);
                              btn.setTextColor(COL_TEXT);
                              btn.setBackground(makeRoundBg(COL_WHITE, 36, 0, 0));
                              btn.setOnClickListener(v -> {
                                  if (pinCode.length() < 4) {
                                      pinCode += key;
                                      refreshDots(dots);
                                      if (pinCode.length() == 4) {
                                          handler.postDelayed(() -> showScreen("loading"), 180);
                                      }
                                  }
                              });
                          }
                          cell.addView(btn);
                          row.addView(cell);
                      }
                      pad.addView(row);
                  }
                  root.addView(pad);

                  TextView forgot = new TextView(this);
                  forgot.setText("Не пам’ятаю код для входу");
