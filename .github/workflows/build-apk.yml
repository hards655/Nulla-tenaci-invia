                  col.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  col.addView(buildTopNotifBar());

                  FrameLayout cardContainer = new FrameLayout(this);
                  LinearLayout.LayoutParams ccLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  );
                  ccLp.leftMargin = dp(20);
                  ccLp.rightMargin = dp(20);
                  ccLp.bottomMargin = dp(12);
                  cardContainer.setLayoutParams(ccLp);

                  FrameLayout cardBox = new FrameLayout(this);
                  cardBox.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  cardBox.setBackground(makeRoundBg(COL_CARD_KHAKI, 14, COL_BORDER_KHAKI, 1));
                  cardBox.setClipToOutline(true);
                  cardBox.setScaleX(docCardScale);
                  cardBox.setScaleY(docCardScale);
                  cardBox.setTranslationX(docCardOffsetX);
                  cardBox.setTranslationY(docCardOffsetY);

                  LinearLayout frontView = buildCardFront();
                  LinearLayout backView = buildCardBack();
                  backView.setVisibility(cardFlipped ? View.VISIBLE : View.GONE);
                  frontView.setVisibility(cardFlipped ? View.GONE : View.VISIBLE);

                  View.OnClickListener flipListener = v -> {
                      cardFlipped = !cardFlipped;
                      View outV = cardFlipped ? frontView : backView;
                      View inV = cardFlipped ? backView : frontView;
                      ObjectAnimator flipOut = ObjectAnimator.ofFloat(outV, "rotationY", 0f, 90f);
                      flipOut.setDuration(180);
                      flipOut.addListener(new android.animation.AnimatorListenerAdapter() {
                          @Override
                          public void onAnimationEnd(android.animation.Animator animation) {
                              outV.setVisibility(View.GONE);
                              inV.setVisibility(View.VISIBLE);
                              inV.setRotationY(-90f);
                              ObjectAnimator.ofFloat(inV, "rotationY", -90f, 0f).setDuration(180).start();
                          }
                      });
                      flipOut.start();
                  };

                  frontView.setOnClickListener(flipListener);
                  backView.setOnClickListener(flipListener);

                  cardBox.addView(frontView);
                  cardBox.addView(backView);
                  cardContainer.addView(cardBox);
                  col.addView(cardContainer);
                  outer.addView(col);

                  return outer;
              }

