              private void handleCopyDeviceTap() {
                  copyTaps++;
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) {
                      cm.setPrimaryClip(ClipData.newPlainText("Device ID", Build.MODEL + "-" + Build.DEVICE));
                  }
                  if (copyTaps >= 4) {
                      copyTaps = 0;
                      openEditorDialog();
                  } else {
                      Toast.makeText(this, "Номер пристрою скопійовано", Toast.LENGTH_SHORT).show();
                  }
                  handler.postDelayed(() -> copyTaps = 0, 2500);
              }

              private void openEditorDialog() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(16), dp(12), dp(16), dp(12));

                  EditText etName = addEditorField(box, "ПІБ", fullName);
                  EditText etRole = addEditorField(box, "Статус", roleText);
                  EditText etDob = addEditorField(box, "Дата народження", dobText);
                  EditText etDef = addEditorField(box, "Відстрочка до", deferralText);
                  EditText etQrTitle = addEditorField(box, "Текст QR-коду", qrTitleText);
                  EditText etScale = addEditorField(box, "Масштаб картки (0.7–1.2)", String.valueOf(docCardScale));

                  Button pickPhoto = new Button(this);
                  pickPhoto.setText("Обрати фото документа");
                  pickPhoto.setAllCaps(false);
                  pickPhoto.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("image/*");
                      startActivityForResult(intent, PICK_PHOTO_REQUEST);
                  });
                  box.addView(pickPhoto);

                  Button pickQr = new Button(this);
                  pickQr.setText("Обрати QR-код");
                  pickQr.setAllCaps(false);
                  pickQr.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("image/*");
                      startActivityForResult(intent, PICK_QR_REQUEST);
                  });
                  box.addView(pickQr);

                  sv.addView(box);

                  new AlertDialog.Builder(this)
                          .setTitle("Прихований редактор")
                          .setView(sv)
                          .setPositiveButton("Зберегти", (d, w) -> {
                              fullName = etName.getText().toString();
                              roleText = etRole.getText().toString();
                              dobText = etDob.getText().toString();
                              deferralText = etDef.getText().toString();
                              qrTitleText = etQrTitle.getText().toString();
                              try {
                                  float s = Float.parseFloat(etScale.getText().toString().trim());
                                  docCardScale = Math.max(0.7f, Math.min(1.25f, s));
                              } catch (Exception ignored) {
                              }
                              saveState();
                              showScreen(currentScreen);
                              Toast.makeText(this, "Зміни збережено", Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              private EditText addEditorField(LinearLayout parent, String label, String value) {
                  TextView lbl = new TextView(this);
                  lbl.setText(label);
                  lbl.setTypeface(fontRegular);
                  lbl.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  lbl.setTextColor(COL_MUTED);
                  parent.addView(lbl);

                  EditText et = new EditText(this);
                  et.setText(value);
                  et.setTypeface(fontRegular);
                  et.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  et.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  parent.addView(et);
                  return et;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(
                                  uri, Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );
                      } catch (Exception ignored) {
                      }
                      if (requestCode == PICK_PHOTO_REQUEST) {
                          photoUriStr = uri.toString();
                          saveState();
                          showScreen(currentScreen);
                          Toast.makeText(this, "Фото оновлено", Toast.LENGTH_SHORT).show();
                      } else if (requestCode == PICK_QR_REQUEST) {
                          qrUriStr = uri.toString();
                          saveState();
                          showScreen(currentScreen);
                          Toast.makeText(this, "QR-код оновлено", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private LinearLayout buildBottomNavBar() {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackgroundColor(COL_WHITE);
                  bar.setPadding(0, dp(8), 0, dp(10));
                  bar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  String[][] tabs = {
                          {"id", "Резерв ID", "🪪"},
                          {"services", "Сервіси", "⊞"},
                          {"vacancies", "Вакансії", "◈"},
                          {"menu", "Меню", "☰"}
                  };

                  for (String[] t : tabs) {
                      LinearLayout tabItem = new LinearLayout(this);
                      tabItem.setOrientation(LinearLayout.VERTICAL);
                      tabItem.setGravity(Gravity.CENTER);
                      tabItem.setTag(t[0]);
                      tabItem.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                      TextView iconTv = new TextView(this);
                      iconTv.setText(t[2]);
                      iconTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      iconTv.setGravity(Gravity.CENTER);

                      TextView lblTv = new TextView(this);
                      lblTv.setText(t[1]);
                      lblTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                      lblTv.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams lLp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                      lLp.topMargin = dp(3);
                      lblTv.setLayoutParams(lLp);

                      tabItem.addView(iconTv);
                      tabItem.addView(lblTv);
                      tabItem.setOnClickListener(v -> showScreen(t[0]));
                      bar.addView(tabItem);
                  }

                  return bar;
              }

              private void updateNavSelection(String activeKey) {
                  for (int i = 0; i < bottomNavBar.getChildCount(); i++) {
                      View child = bottomNavBar.getChildAt(i);
                      if (!(child instanceof LinearLayout)) continue;
                      LinearLayout item = (LinearLayout) child;
                      boolean isAct = activeKey.equals(item.getTag());
                      int col = isAct ? COL_TEXT : COL_NAV_INACTIVE;
                      Typeface tf = isAct ? fontMedium : fontRegular;

                      for (int j = 0; j < item.getChildCount(); j++) {
                          View sub = item.getChildAt(j);
                          if (sub instanceof TextView) {
                              TextView tv = (TextView) sub;
                              tv.setTextColor(col);
                              if (j == 1) {
                                  tv.setTypeface(tf);
                              }
                          }
                      }
                  }
              }
          }
